# Phase 1: Python 3 port validation stack.
#
# Not a deployment file - see docker-compose.yml for that. This exists
# to run the test suite against the python3-port branch's validation
# image (docker/py3/Dockerfile) with the services it needs on the
# network, the same purpose docker-compose.ci.yml serves for the
# Phase 0 Python 2 control channel. See PORTING.md.
#
# Service names (redis, elasticsearch, postgres, mariadb) are
# load-bearing: tests/settings.py hardcodes these as cache/search-
# backend/DB hostnames. Which DB backend sqlite/postgres/mariadb gets
# used is selected the same way docker-compose.ci.yml's Python 2
# control channel does it: the APP_DB_ENV env var (unset/empty means
# sqlite), plus starting the one DB service that run actually needs -
# postgres and mariadb aren't in `test`'s depends_on so a plain
# `up -d redis elasticsearch` (the sqlite case) doesn't pull either
# image needlessly.
#
# Usage (`docker compose` or the standalone `docker-compose` binary,
# whichever this machine has):
#   docker-compose -f docker-compose.py3.yml build test
#   docker-compose -f docker-compose.py3.yml up -d redis elasticsearch
#   docker-compose -f docker-compose.py3.yml run --rm test
#   # postgres:
#   docker-compose -f docker-compose.py3.yml up -d redis elasticsearch postgres
#   APP_DB_ENV=postgres docker-compose -f docker-compose.py3.yml run --rm test
#   # mariadb:
#   docker-compose -f docker-compose.py3.yml up -d redis elasticsearch mariadb
#   APP_DB_ENV=mariadb docker-compose -f docker-compose.py3.yml run --rm test
#   docker-compose -f docker-compose.py3.yml down -v

services:
  test:
    build:
      context: .
      dockerfile: docker/py3/Dockerfile
    environment:
      - APP_DB_ENV=${APP_DB_ENV:-}
    depends_on:
      - redis
      - elasticsearch
    # requirements/tests_py3.txt is baked into the image itself (see
    # docker/py3/Dockerfile), so this is a plain, overridable default
    # - `docker-compose -f docker-compose.py3.yml run --rm test
    # pytest tests/some_file.py -q` works as expected instead of
    # silently dropping the pip install a runtime-only command would
    # need.
    command: ["pytest", "tests", "-q"]

  postgres:
    image: postgres:9.4-alpine
    environment:
      - POSTGRES_USER=pootle
      - POSTGRES_PASSWORD=CHANGEME
      - POSTGRES_DB=pootledb
    tmpfs:
      - /var/lib/postgresql/data

  mariadb:
    image: mariadb:10.3
    # No --init-connect: this image's entrypoint mis-splits any
    # multi-word option value into extra positional args and aborts
    # ("Too many arguments") - same finding as docker-compose.ci.yml,
    # which this config otherwise mirrors exactly. character-set-
    # server/collation-server below cover what's needed; the app also
    # sets its own sql_mode via DATABASES OPTIONS in tests/settings.py.
    command:
      - mysqld
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --innodb-flush-log-at-trx-commit=0
    environment:
      # MARIADB_* not MYSQL_*, and CHANGEME not empty - see
      # docker-compose.ci.yml's own comment for why (same image,
      # same finding).
      - MARIADB_ROOT_PASSWORD=CHANGEME
      - MARIADB_DATABASE=pootledb
    tmpfs:
      - /var/lib/mysql

  redis:
    image: redis:7-alpine
    tmpfs:
      - /data

  elasticsearch:
    # Same image/version this repo's own docker-compose.yml already
    # pairs with the elasticsearch~=5.0 client pinned in
    # requirements/_es_5.txt - the elasticsearch-py 5.x client talks to
    # a 6.x server fine (ES's REST API keeps one-major-version
    # backwards compatibility), verified directly (indices.exists/
    # create/index/search all round-tripped correctly) before wiring
    # this in. No arm64 build exists for this image (predates Elastic's
    # multi-arch images) - runs under x86 emulation on Apple Silicon,
    # hence the pinned platform. Startup under emulation took 24s-ish
    # in testing; this is a one-time cost since the container stays up
    # for the whole test session, not per test run.
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:6.2.3
    platform: linux/amd64
    environment:
      - discovery.type=single-node
      # -Djava.security.egd=...: without this, JVM startup can block
      # indefinitely reading from /dev/random for SecureRandom seeding
      # - a well-known ES-in-Docker gotcha, and confirmed directly
      # here (one cold start came up in 24s, another sat at 0 log
      # lines/100% CPU for 7+ minutes before being killed). urandom is
      # fine for a disposable test index, not a production concern.
      - ES_JAVA_OPTS=-Xms256m -Xmx256m -Djava.security.egd=file:/dev/./urandom
    tmpfs:
      - /usr/share/elasticsearch/data
