# Phase 0, stream D: a minimally-seeded running instance for the
# Playwright smoke suite (e2e/) to point at. Not a deployment file - see
# docker-compose.yml for that.

services:
  web:
    build:
      context: .
      dockerfile: docker/e2e/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:9.4-alpine
    environment:
      - POSTGRES_USER=pootle
      - POSTGRES_PASSWORD=CHANGEME
      - POSTGRES_DB=pootledb
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    tmpfs:
      - /data
