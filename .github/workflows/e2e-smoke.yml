name: E2E smoke suite

# Phase 0, streams D & E: a curated Playwright suite (stream D) and a
# golden-master drift check (stream E, e2e/snapshot.js) against the same
# running, minimally-seeded Pootle instance (docker-compose.e2e.yml,
# docker/e2e/Dockerfile). Deliberately scoped to what's real without the
# Phase 4 frontend rebuild - see e2e/tests/smoke.spec.js's header and
# PORTING.md for what's covered vs. deferred and why. Watches this fork's
# main only - see PORTING.md; never targets upstream/translate/pootle.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the e2e stack
        run: docker compose -f docker-compose.e2e.yml up -d --build

      # initdb seeds a real demo dataset (a "terminology" project across
      # dozens of languages) on every container start - locally this
      # takes ~90s-2min under QEMU emulation (this fork's dev machine is
      # arm64), so give it real headroom here too rather than guessing a
      # tight budget. Dump the container logs on failure so a repeat
      # failure is diagnosable instead of a bare timeout.
      - name: Wait for the app to accept connections
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:8000/ >/dev/null && exit 0
            sleep 5
          done
          echo "::error::App did not come up in time - dumping container logs"
          docker compose -f docker-compose.e2e.yml logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the smoke suite
        working-directory: e2e
        run: npx playwright test

      # Stream E: normalized record counts/schemas/ids and page
      # title/structure, diffed against e2e/snapshots/baseline.json.
      # Deliberately not raw bytes - see snapshot.js's header.
      - name: Check for golden-master drift
        working-directory: e2e
        run: node snapshot.js

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
