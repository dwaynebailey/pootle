name: E2E smoke suite

# Phase 0, stream D: a curated Playwright suite against a running,
# minimally-seeded Pootle instance (docker-compose.e2e.yml,
# docker/e2e/Dockerfile). Deliberately scoped to what's real without the
# Phase 4 frontend rebuild - see e2e/tests/smoke.spec.js's header and
# PORTING.md for what's covered vs. deferred and why. Watches this fork's
# main only - see PORTING.md; never targets upstream/translate/pootle.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the e2e stack
        run: docker compose -f docker-compose.e2e.yml up -d --build

      - name: Wait for the app to accept connections
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/ >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8000/ >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the smoke suite
        working-directory: e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
