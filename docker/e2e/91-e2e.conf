# -*- coding: utf-8 -*-
#
# Phase 0, stream D: settings for the Playwright smoke-suite server. Not
# a production config - copied to pootle/settings/91-e2e.conf at build
# time, sorts after the shipped defaults (pootle/settings.py execs
# pootle/settings/*.conf in sorted order) so it overrides them.

import os

SECRET_KEY = 'e2e-not-a-real-secret'
ALLOWED_HOSTS = ['*']
DEBUG = True

DATABASES['default']['ENGINE'] = 'django.db.backends.postgresql'
DATABASES['default']['NAME'] = 'pootledb'
DATABASES['default']['USER'] = 'pootle'
DATABASES['default']['HOST'] = 'postgres'
DATABASES['default']['PASSWORD'] = 'CHANGEME'

CACHES['default']['LOCATION'] = 'redis://redis:6379/1'
CACHES['redis']['LOCATION'] = 'redis://redis:6379/2'
CACHES['lru']['LOCATION'] = 'redis://redis:6379/3'

# Same fix as tests/settings.py (streams B/C): the default requires a
# pre-built webassets manifest for the bundles webassets *can* assemble
# (the CSS ones). The JS ones are stubbed separately - see
# docker/e2e/stub-assets.sh - since they reference literal webpack
# output files webassets doesn't build itself either way.
ASSETS_DEBUG = True

# Without this, login (which sends a confirmation email) tries to reach a
# real SMTP server and fails outright - same fix as tests/settings.py.
EMAIL_BACKEND = 'django.core.mail.backends.console.EmailBackend'
